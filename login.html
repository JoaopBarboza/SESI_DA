<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PharmaShop</title>
    <link rel="stylesheet" href="login.style.css">
</head>
<body>
    <div class="container">
        <div class="lado-esquerdo">
            <h1>Bem-Vindo</h1>
            <img src="aula_06/pianna.jpg" alt="">
        </div>

        <div class="lado-direito">
            <h2>Encontre tudo o que você precisa para seu físico</h2>
            
            <div class="botoes-login">
                <button class="botao google">
                    <span class="icone">G</span> Entrar com Google
                </button>
                
                <button class="botao apple">
                    <span class="icone">🍎</span> Entrar com Apple
                </button>
                
                <button class="botao email">
                    <span class="icone">✉</span> Entrar com E-mail
                </button>
            </div>
            
            <button class="botao-vamos-la">Vamos lá</button>
        </div>
    </div>
</body>

</html>
